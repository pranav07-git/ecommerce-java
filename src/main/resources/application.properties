spring.application.name=ecommerce
server.port=8080

# Embedded file-based H2 database (persists in ./data between restarts)
spring.datasource.url=jdbc:h2:file:./data/ecommerce;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# H2 web console at /h2-console (admins only, see SecurityConfig).
# JDBC URL: jdbc:h2:file:./data/ecommerce;AUTO_SERVER=TRUE  user: sa  password: (empty)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
