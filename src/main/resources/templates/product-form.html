<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card" style="max-width:640px">
        <h2 th:text="${title}"></h2>
        <form class="stack" th:action="@{${action}}" th:object="${form}" method="post">
            <div th:if="${sellers != null}">
                <label>Seller</label>
                <select th:field="*{sellerId}">
                    <option value="">Choose seller…</option>
                    <option th:each="s : ${sellers}" th:value="${s.id}" th:text="${s.name} + ' (' + ${s.email} + ')'"></option>
                </select>
            </div>
            <label>Name</label>
            <input th:field="*{name}" required>
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            <label>Description</label>
            <textarea th:field="*{description}"></textarea>
            <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            <label>Price</label>
            <input th:field="*{price}" type="number" step="0.01" min="0.01" required>
            <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            <label>Stock</label>
            <input th:field="*{stock}" type="number" min="0" required>
            <div class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
            <label>Low-stock alert threshold</label>
            <input th:field="*{lowStockThreshold}" type="number" min="0" required>
            <label>Category</label>
            <input th:field="*{category}">
            <label>Image URL (optional)</label>
            <input th:field="*{imageUrl}" type="url">
            <p><button class="btn" type="submit">Save</button> <a class="btn ghost" th:href="@{${back}}">Cancel</a></p>
        </form>
    </div>
</main>
</body>
</html>
